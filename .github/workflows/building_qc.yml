name: Audit Overture building matches

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/building_qc.yml"
  workflow_run:
    workflows: ["Extract So2Sat LCZ labels"]
    types: [completed]

permissions:
  contents: write

jobs:
  building-qc:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        city: [mumbai, munich, guangzhou, sanfrancisco]

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install overturemaps geopandas pyarrow shapely pyproj pandas numpy

      - name: Prepare directories
        run: mkdir -p work results/building_qc

      - name: Build city bounding box
        id: bbox
        shell: bash
        run: |
          BBOX=$(python qc/build_city_bbox.py --city "${{ matrix.city }}")
          echo "bbox=$BBOX" >> "$GITHUB_OUTPUT"
          echo "City bbox: $BBOX"

      - name: Download Overture buildings
        shell: bash
        run: |
          overturemaps download             --bbox="${{ steps.bbox.outputs.bbox }}"             --type=building             --release=2026-10-21.0             -f geoparquet             -o "work/${{ matrix.city }}_buildings.parquet"

      - name: Audit building-to-patch matches
        run: |
          python qc/audit_buildings.py             --city "${{ matrix.city }}"             --buildings "work/${{ matrix.city }}_buildings.parquet"

      - name: Upload city QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: building-qc-${{ matrix.city }}
          path: |
            results/building_qc/${{ matrix.city }}_patch_building_qc.csv
            results/building_qc/${{ matrix.city }}_class_summary.csv
            results/building_qc/${{ matrix.city }}_summary.json
          retention-days: 7

  combine:
    needs: building-qc
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download city artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: building-qc-*
          path: results/building_qc
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pandas
        run: pip install pandas

      - name: Build combined QC summaries
        run: python qc/summarize_building_qc.py

      - name: Commit lightweight QC outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/building_qc
          if git diff --cached --quiet; then
            echo "No QC result changes to commit."
            exit 0
          fi
          git commit -m "Add multi-city Overture building QC"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
