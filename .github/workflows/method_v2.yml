name: Test zoning-robust V2 pilot

on:
  workflow_dispatch:
  push:
    paths:
      - "method/train_anchor_robust.py"
      - "docs/method_v2.md"
      - ".github/workflows/method_v2.yml"

permissions:
  contents: write

jobs:
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        city: [guangzhou, mumbai, munich, sanfrancisco]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install overturemaps pyarrow shapely pyproj pandas numpy

      - name: Prepare directories
        run: mkdir -p work/features work/buildings

      - name: Build city bbox
        id: bbox
        shell: bash
        run: |
          BBOX=$(python qc/build_city_bbox.py --city "${{ matrix.city }}")
          echo "bbox=$BBOX" >> "$GITHUB_OUTPUT"

      - name: Download buildings
        run: |
          overturemaps download             --bbox="${{ steps.bbox.outputs.bbox }}"             --type=building             --release=2026-10-21.0             -f geoparquet             -o "work/buildings/${{ matrix.city }}.parquet"

      - name: Build zoning features
        run: |
          pip install scikit-learn
          python method/build_zoning_features.py             --city "${{ matrix.city }}"             --buildings "work/buildings/${{ matrix.city }}.parquet"             --output "work/features/${{ matrix.city }}.parquet"

      - name: Upload features
        uses: actions/upload-artifact@v4
        with:
          name: v2-features-${{ matrix.city }}
          path: work/features/${{ matrix.city }}.parquet
          retention-days: 7

  train:
    needs: features
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: pip install numpy pandas pyarrow scikit-learn torch

      - name: Download feature artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v2-features-*
          path: work/features
          merge-multiple: true

      - name: Train V2 pilot
        run: python method/train_anchor_robust.py

      - name: Commit V2 pilot outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/method_v2_pilot
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add zoning-robust V2 pilot results"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
