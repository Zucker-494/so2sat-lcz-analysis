name: Exact city-level inference

on:
  workflow_dispatch:
  push:
    paths:
      - "benchmark/run_exact_city_inference.py"
      - ".github/workflows/exact_city_inference.yml"

permissions:
  contents: write

jobs:
  exact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - name: Run exact city-level inference
        run: python benchmark/run_exact_city_inference.py
      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exact_city_inference
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add exact city-level inference"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
